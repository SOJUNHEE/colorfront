<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>COLORFRONT 아바타 미리보기</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: #1c2533;
                font-family: system-ui, sans-serif;
            }
            canvas {
                width: 100%;
                height: 100%;
                display: block;
            }
            #ui {
                position: fixed;
                left: 12px;
                top: 12px;
                display: flex;
                flex-direction: column;
                gap: 6px;
                color: #eee8db;
                font-size: 13px;
                background: rgba(18, 22, 30, 0.78);
                padding: 10px 12px;
                border-radius: 8px;
                max-width: 360px;
            }
            #ui .row {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
            }
            #ui button {
                background: #35425b;
                color: #eee8db;
                border: 0;
                border-radius: 4px;
                padding: 4px 8px;
                cursor: pointer;
                font-size: 12px;
            }
            #ui button.on {
                background: #2876f2;
            }
            #status {
                opacity: 0.85;
            }
        </style>
    </head>
    <body>
        <canvas id="preview-canvas"></canvas>
        <div id="ui">
            <strong>Neon Courier — Phase 6 Gate 1 미리보기</strong>
            <div id="status">로딩 중…</div>
            <div class="row" id="views"></div>
            <div class="row" id="poses"></div>
        </div>
        <script type="module" src="/src/preview/avatarPreview.ts"></script>
    </body>
</html>
